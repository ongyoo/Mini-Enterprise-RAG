<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 830" width="1160" height="830" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6170"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1f2430; }
      .h { font-size: 15px; font-weight: 700; fill: #1f2430; }
      .t { font-size: 12.5px; fill: #4a5160; }
      .node { font-size: 12px; font-weight: 600; fill: #1f2430; font-family: Menlo, Consolas, monospace; }
      .lbl { font-size: 11.5px; fill: #5a6170; font-style: italic; }
      .line { stroke: #5a6170; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1160" height="830" rx="14" fill="#ffffff"/>
  <text x="60" y="38" class="title">Mini Enterprise RAG — architecture</text>

  <!-- Users -->
  <rect x="160" y="60" width="320" height="62" rx="10" fill="#e8f0fe" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="320" y="86" text-anchor="middle" class="h">Employee</text>
  <text x="320" y="106" text-anchor="middle" class="t">Chat page (HTML + JS) · localhost:8000/</text>

  <rect x="680" y="60" width="320" height="62" rx="10" fill="#e8f0fe" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="840" y="86" text-anchor="middle" class="h">Admin / developer</text>
  <text x="840" y="106" text-anchor="middle" class="t">Streamlit console · localhost:8501</text>

  <line x1="320" y1="122" x2="320" y2="158" class="line" marker-end="url(#arrow)"/>
  <line x1="840" y1="122" x2="840" y2="158" class="line" marker-end="url(#arrow)"/>
  <text x="330" y="145" class="lbl">POST /api/v1/chat</text>
  <text x="850" y="145" class="lbl">REST + bearer token</text>

  <!-- API -->
  <rect x="60" y="160" width="1040" height="64" rx="10" fill="#fff3e0" stroke="#e08a00" stroke-width="1.5"/>
  <text x="580" y="186" text-anchor="middle" class="h">FastAPI · Pydantic v2</text>
  <text x="580" y="207" text-anchor="middle" class="t">demo bearer auth → server-side scopes · request IDs · /chat · /documents · /admin/ingest · /admin/evaluations · /admin/audit-logs</text>

  <line x1="580" y1="224" x2="580" y2="262" class="line" marker-end="url(#arrow)"/>

  <!-- LangGraph -->
  <rect x="60" y="264" width="1040" height="150" rx="10" fill="#f3f4f8" stroke="#9aa3b5" stroke-width="1.5"/>
  <text x="80" y="290" class="h">LangGraph pipeline</text>
  <text x="250" y="290" class="t">app/graph · one state object flows through the nodes</text>

  <g>
    <rect x="84" y="312" width="128" height="40" rx="8" fill="#ffffff" stroke="#5b6b8c"/>
    <text x="148" y="337" text-anchor="middle" class="node">validate_input</text>
    <rect x="228" y="312" width="128" height="40" rx="8" fill="#ffffff" stroke="#5b6b8c"/>
    <text x="292" y="337" text-anchor="middle" class="node">retrieve</text>
    <rect x="372" y="312" width="128" height="40" rx="8" fill="#ffffff" stroke="#5b6b8c"/>
    <text x="436" y="337" text-anchor="middle" class="node">evidence_gate</text>
    <rect x="516" y="312" width="128" height="40" rx="8" fill="#fde8ef" stroke="#c2185b"/>
    <text x="580" y="337" text-anchor="middle" class="node">rewrite_query</text>
    <rect x="660" y="312" width="128" height="40" rx="8" fill="#ffffff" stroke="#5b6b8c"/>
    <text x="724" y="337" text-anchor="middle" class="node">generate</text>
    <rect x="804" y="312" width="128" height="40" rx="8" fill="#ffffff" stroke="#5b6b8c"/>
    <text x="868" y="337" text-anchor="middle" class="node">verify_output</text>
    <rect x="948" y="312" width="140" height="40" rx="8" fill="#ffffff" stroke="#5b6b8c"/>
    <text x="1018" y="337" text-anchor="middle" class="node">audit_and_finalize</text>

    <line x1="212" y1="332" x2="226" y2="332" class="line" marker-end="url(#arrow)"/>
    <line x1="356" y1="332" x2="370" y2="332" class="line" marker-end="url(#arrow)"/>
    <line x1="500" y1="332" x2="514" y2="332" class="line" marker-end="url(#arrow)"/>
    <line x1="644" y1="332" x2="658" y2="332" class="line" marker-end="url(#arrow)"/>
    <line x1="788" y1="332" x2="802" y2="332" class="line" marker-end="url(#arrow)"/>
    <line x1="932" y1="332" x2="946" y2="332" class="line" marker-end="url(#arrow)"/>

    <path d="M580,352 C580,384 292,384 292,354" class="line" stroke-dasharray="5 4" stroke="#c2185b" marker-end="url(#arrow)"/>
    <text x="436" y="398" text-anchor="middle" class="lbl" fill="#c2185b">typo / slang / "cannot answer" → rewrite once, search again</text>
    <text x="868" y="398" text-anchor="middle" class="lbl">failures → fallback with topic list</text>
  </g>

  <!-- Arrows to services -->
  <line x1="180" y1="414" x2="180" y2="468" class="line" marker-end="url(#arrow)"/>
  <text x="190" y="446" class="lbl">input + output checks</text>
  <line x1="446" y1="414" x2="446" y2="468" class="line" marker-end="url(#arrow)"/>
  <text x="456" y="446" class="lbl">embed query</text>
  <line x1="712" y1="414" x2="712" y2="468" class="line" marker-end="url(#arrow)"/>
  <text x="722" y="446" class="lbl">rewrite · answer</text>
  <line x1="978" y1="414" x2="978" y2="468" class="line" marker-end="url(#arrow)"/>
  <text x="988" y="446" class="lbl">vector search · audit</text>

  <!-- Services -->
  <rect x="60" y="470" width="240" height="116" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="180" y="496" text-anchor="middle" class="h">Guardrails</text>
  <text x="180" y="518" text-anchor="middle" class="t">injection + scope rules</text>
  <text x="180" y="536" text-anchor="middle" class="t">PII redaction</text>
  <text x="180" y="554" text-anchor="middle" class="t">citation + number check</text>
  <text x="180" y="572" text-anchor="middle" class="t">HMAC-hashed audit</text>

  <rect x="326" y="470" width="240" height="116" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="446" y="496" text-anchor="middle" class="h">Embeddings (local)</text>
  <text x="446" y="518" text-anchor="middle" class="t">fastembed · ONNX on CPU</text>
  <text x="446" y="536" text-anchor="middle" class="t">paraphrase-multilingual-</text>
  <text x="446" y="554" text-anchor="middle" class="t">mpnet-base-v2 · 768 dims</text>
  <text x="446" y="572" text-anchor="middle" class="t">no API key, no network</text>

  <rect x="592" y="470" width="240" height="116" rx="10" fill="#fbeee6" stroke="#c9622f" stroke-width="1.5"/>
  <text x="712" y="496" text-anchor="middle" class="h">Claude Opus 5.5</text>
  <text x="712" y="518" text-anchor="middle" class="t">Anthropic Python SDK</text>
  <text x="712" y="536" text-anchor="middle" class="t">structured output (Pydantic)</text>
  <text x="712" y="554" text-anchor="middle" class="t">effort low · refusal fallback</text>
  <text x="712" y="572" text-anchor="middle" class="t">sources labelled S1..Sn</text>

  <rect x="858" y="470" width="242" height="116" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="979" y="496" text-anchor="middle" class="h">PostgreSQL 16 + pgvector</text>
  <text x="979" y="518" text-anchor="middle" class="t">SQLAlchemy 2 · Alembic</text>
  <text x="979" y="536" text-anchor="middle" class="t">documents · chunks (vector)</text>
  <text x="979" y="554" text-anchor="middle" class="t">query_logs · retrieval_hits</text>
  <text x="979" y="572" text-anchor="middle" class="t">ingestion + evaluation runs</text>

  <!-- Offline jobs -->
  <rect x="60" y="640" width="505" height="92" rx="10" fill="#fafafa" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="666" class="h">Ingest</text>
  <text x="140" y="666" class="t">make ingest · make reset-docs</text>
  <text x="80" y="690" class="t">data/documents.jsonl → normalise formats → validate</text>
  <text x="80" y="710" class="t">→ LangChain text splitter → embed → upsert by version</text>

  <rect x="595" y="640" width="505" height="92" rx="10" fill="#fafafa" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="615" y="666" class="h">Evaluation</text>
  <text x="705" y="666" class="t">make eval · admin Evaluation tab</text>
  <text x="615" y="690" class="t">data/evaluation.jsonl (40 cases) → same graph per threshold</text>
  <text x="615" y="710" class="t">→ accuracy, Recall@5, MRR, fact match … → reports/*.json</text>

  <line x1="446" y1="640" x2="446" y2="588" class="line" marker-end="url(#arrow)"/>
  <text x="436" y="624" text-anchor="end" class="lbl">embed chunks</text>
  <path d="M520,640 V612 H930 V590" class="line" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="725" y="606" text-anchor="middle" class="lbl">store documents + chunks</text>
  <line x1="978" y1="640" x2="978" y2="588" class="line" marker-end="url(#arrow)"/>
  <text x="988" y="620" class="lbl">store runs</text>

  <!-- Footer -->
  <rect x="60" y="760" width="1040" height="44" rx="10" fill="#eef0f4" stroke="#c9ced8"/>
  <text x="580" y="787" text-anchor="middle" class="t">Docker Compose: db · api · ui  ·  Python 3.12 · pip + requirements.txt · ruff · mypy strict · pytest (78 unit tests)</text>
</svg>
